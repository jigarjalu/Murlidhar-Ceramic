name: murlidhar_ceramic
description: "Murlidhar Ceramic - Premium Tiles & Ceramic Solutions Catalog and Enquiry Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # UI, Fonts & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0

  # Images & Caching
  cached_network_image: ^3.3.1

  # Storage & Utilities
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  shared_preferences_foundation: 2.5.4
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/reference/
